<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 — User Directory</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main { width: min(760px, 100%); margin: 0 auto; }
    header { margin-bottom: 1.5rem; }
    h1 { margin-bottom: .4rem; }
    .muted { color: #5d687c; }
    .controls { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.25rem 0; }
    button, input { font: inherit; border-radius: .65rem; padding: .75rem .9rem; }
    button { border: 0; background: #2457d6; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    input { border: 1px solid #cbd3e1; background: white; flex: 1; min-width: 200px; }
    #status { min-height: 1.5rem; color: #44516a; }
    #users-list { list-style: none; padding: 0; display: grid; gap: .9rem; }
    .user-card { background: white; border: 1px solid #e0e6ef; border-radius: .9rem; padding: 1rem 1.1rem; box-shadow: 0 3px 12px rgb(20 35 70 / 5%); }
    .user-card h2 { margin: 0 0 .55rem; font-size: 1.1rem; }
    .user-card p { margin: .3rem 0; overflow-wrap: anywhere; }
    @media (max-width: 520px) { body { padding: 1.25rem .8rem; } .controls { flex-direction: column; } input { min-width: 0; } }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>User Directory</h1>
      <p class="muted">Fetch users from a REST API and filter the results by name.</p>
    </header>
    <button id="load-users" type="button">Load users</button>
    <div class="controls">
      <label for="filter-input">Filter users by name</label>
      <input id="filter-input" type="search" placeholder="Start typing a name…" autocomplete="off">
    </div>
    <p id="status" role="status" aria-live="polite">Select “Load users” to get started.</p>
    <ul id="users-list" aria-label="Users list"></ul>
  </main>
</body>
</html>
